
# --------------general---------------------

set -g default-terminal "screen-256color"

set -g history-limit 1000

# Enable mouse mode
# set -g mouse on

# Start window numbering at 1
set -g base-index 1

# Start pane numbering at 1
setw -g pane-base-index 1

# --------------clipboard (OSC52, no $DISPLAY/xclip)---------------------
# WAYLANDIA-CLIP #15/#18 — mirrors home-manager/shell/tmux
set -g set-clipboard on
set -g allow-passthrough on
# Ms takes TWO parameters: %p1 = selection, %p2 = base64 payload. The old
# `Ms=\E]52;c;%p1%s\007` emitted the selection as the payload and dropped %p2;
# tmux responded by emitting nothing at all. Both params must be consumed.
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
